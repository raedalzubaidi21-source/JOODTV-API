name: Update JOOD-TV

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python generate.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add JOOD-TV.json
          git diff --quiet && git diff --staged --quiet || git commit -m "تحديث تلقائي"
          git push
