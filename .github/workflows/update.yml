name: تحديث بين سبورت اليومي

on:
  schedule:
    - cron: '0 12 * * *'   # الساعة 12 ظهراً بتوقيت جرينتش = 3 عصراً بتوقيت العراق
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # ✅ الترقية إلى الإصدار v6 الذي يدعم Node.js 24 رسمياً
      - uses: actions/checkout@v6
      
      # ✅ الترقية إلى الإصدار v6 الذي يدعم Node.js 24 رسمياً
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      
      - run: pip install playwright
      - run: playwright install chromium
      
      - run: python scraper.py
      
      # ✅ الإصدار v7 يضمن التوافق مع Node.js 24 (تم إضافة الدعم في الإصدار 7.0.0)[reference:2][reference:3]
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "تحديث تلقائي لروابط M3U8"
          file_pattern: JOOD-TV.json
