name: تحديث بين سبورت اليومي

on:
  schedule:
    - cron: '0 12 * * *'   # الساعة 12 ظهراً بتوقيت جرينتش = 3 عصراً بتوقيت العراق
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # تم التحديث من v3 إلى v4 (الإصدار v4.2.0 أو أحدث يدعم Node.js 24)[reference:3]
      - uses: actions/checkout@v4
      
      # تم التحديث من v4 إلى v5 (الإصدار v5 يدعم Node.js 24)[reference:4]
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - run: pip install playwright
      - run: playwright install chromium
      
      - run: python scraper.py
      
      # تم التحديث من v4 إلى v7 (الإصدار v5.2.0 فما فوق يدعم Node.js 24)[reference:5][reference:6]
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "تحديث تلقائي لروابط M3U8"
          file_pattern: JOOD-TV.json
