name: تحديث بين سبورت اليومي

on:
  schedule:
    - cron: '0 12 * * *'   # الساعة 12 ظهراً بتوقيت جرينتش = 3 عصراً بتوقيت العراق
  workflow_dispatch:       # يسمح لك بتشغيله يدوياً عند الحاجة (مثل الآن)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - run: pip install requests
      
      - run: python scraper.py
      
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "تحديث تلقائي لروابط بين سبورت - 3 عصراً"
          file_pattern: JOOD-TV.json
